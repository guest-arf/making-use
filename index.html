<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sega Genesis Emulator</title>
  <style>
    body {
      background: #000;
      color: white;
      text-align: center;
      font-family: sans-serif;
    }
    canvas {
      border: 2px solid white;
      image-rendering: pixelated;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #666;
    }
  </style>
</head>
<body>
  <h1>Sega Genesis Emulator</h1>
  <input type="file" id="romLoader" accept=".bin,.gen,.md"><br><br>
  <canvas id="emulatorCanvas" width="320" height="224"></canvas><br>
  <button id="fullscreenBtn">Fullscreen</button>

  <!-- Emulator Script -->
  <script src="Emulatrix_SegaGenesis.js"></script>

  <!-- Emulator Init + Fullscreen -->
  <script>
    const canvas = document.getElementById('emulatorCanvas');
    const romLoader = document.getElementById('romLoader');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    romLoader.addEventListener('change', async function () {
      const file = romLoader.files[0];
      if (!file) return;

      const arrayBuffer = await file.arrayBuffer();
      const romData = new Uint8Array(arrayBuffer);

      if (window.EmulatrixSegaGenesis) {
        const emulator = new EmulatrixSegaGenesis(canvas);
        emulator.loadROM(romData);
        emulator.start();
      } else {
        alert('Emulator failed to load. Check your script reference.');
      }
    });

    fullscreenBtn.addEventListener('click', () => {
      if (canvas.requestFullscreen) {
        canvas.requestFullscreen();
      } else if (canvas.webkitRequestFullscreen) {
        canvas.webkitRequestFullscreen();
      } else if (canvas.msRequestFullscreen) {
        canvas.msRequestFullscreen();
      } else {
        alert('Fullscreen not supported in this browser.');
      }
    });
  </script>
</body>
</html>
